spring:
  application:
    name: booknest-platform
  jpa:
    open-in-view: true

  profiles:
    active: dev

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000  #24 hours
      refresh-token:
        expiration: 604800000 #7 Days

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html