<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Book Club Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f0eb; color: #2c1810; }

        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { background: #5c3d2e; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .header h1 { font-size: 28px; }
        .header span { color: #e8b87a; }

        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { color: #5c3d2e; margin-bottom: 16px; font-size: 20px; }

        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #ddd6ce; border-radius: 8px; font-size: 15px; transition: border 0.2s; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #5c3d2e; }
        textarea { min-height: 80px; resize: vertical; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: #5c3d2e; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn { background: #5c3d2e; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: #7a5238; transform: translateY(-1px); }
        .btn-secondary { background: #e8b87a; color: #5c3d2e; }
        .btn-danger { background: #c0392b; }
        .btn-small { padding: 8px 16px; font-size: 13px; }

        .flex { display: flex; gap: 12px; flex-wrap: wrap; }
        .flex > * { flex: 1; min-width: 200px; }

        .book-card { background: #faf8f5; border-left: 4px solid #e8b87a; padding: 16px; margin-bottom: 12px; border-radius: 0 8px 8px 0; }
        .book-card h3 { color: #5c3d2e; margin-bottom: 4px; }
        .book-card p { color: #7a6e65; font-size: 14px; }

        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .status-available { background: #d4edda; color: #155724; }
        .status-borrowed { background: #fff3cd; color: #856404; }

        .token-info { background: #2c1810; color: #e8b87a; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 11px; word-break: break-all; margin-top: 8px; max-height: 60px; overflow: hidden; }
        .hidden { display: none; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab { padding: 10px 20px; border-radius: 8px 8px 0 0; background: #ddd6ce; cursor: pointer; font-weight: 600; font-size: 14px; }
        .tab.active { background: #5c3d2e; color: white; }

        @media (max-width: 600px) { .flex > * { min-width: 100%; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📚 Book<span>Nest</span></h1>
        <p style="margin-top: 8px; opacity: 0.9;">Share books, track reading, build community</p>
    </div>

    <!-- AUTH SECTION -->
    <div class="card" id="auth-section">
        <h2>🔐 Authentication</h2>
        <div class="flex">
            <div>
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your name">
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="reg-email" placeholder="your@email.com">
            </div>
        </div>
        <div class="flex">
            <div>
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Min 8 characters">
            </div>
            <div>
                <label>City</label>
                <input type="text" id="reg-city" placeholder="Mumbai">
            </div>
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="btn" onclick="register()">Register</button>
            <button class="btn btn-secondary" onclick="login()">Login</button>
        </div>
    </div>

    <!-- CLUB SECTION (hidden until logged in) -->
    <div class="card hidden" id="club-section">
        <h2>🏠 Book Club</h2>
        <div class="flex">
            <div>
                <label>Club Name</label>
                <input type="text" id="club-name" placeholder="My Book Club">
            </div>
            <div>
                <label>City</label>
                <input type="text" id="club-city" placeholder="Mumbai">
            </div>
        </div>
        <div class="flex">
            <div>
                <label>State</label>
                <input type="text" id="club-state" placeholder="Maharashtra">
            </div>
            <div>
                <label>Club Type</label>
                <select id="club-type">
                    <option value="FICTION">Fiction</option>
                    <option value="NON_FICTION">Non-Fiction</option>
                    <option value="KIDS">Kids</option>
                    <option value="ACADEMIC">Academic</option>
                    <option value="GENERAL">General</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="createClub()">Create Club</button>
        <button class="btn btn-secondary" onclick="searchClubs()">Search Clubs</button>
        <div id="club-result" style="margin-top: 12px;"></div>
    </div>

    <!-- BOOK LENDING SECTION -->
    <div class="card hidden" id="book-section">
        <h2>📖 Books</h2>
        <div class="flex">
            <div>
                <label>Title</label>
                <input type="text" id="book-title" placeholder="Book title">
            </div>
            <div>
                <label>Author</label>
                <input type="text" id="book-author" placeholder="Author name">
            </div>
        </div>
        <div class="flex">
            <div>
                <label>Lending Policy</label>
                <select id="book-policy">
                    <option value="FREE">Free</option>
                    <option value="DEPOSIT_BASED">Deposit (₹)</option>
                    <option value="SUBSCRIPTION_BASED">Subscription</option>
                </select>
            </div>
            <div>
                <label>Deposit Amount (₹)</label>
                <input type="number" id="book-deposit" placeholder="200" value="200">
            </div>
        </div>
        <div class="flex">
            <div>
                <label>Club ID</label>
                <input type="text" id="book-club-id" placeholder="Paste club ID">
            </div>
            <div>
                <label>Max Borrow Days</label>
                <input type="number" id="book-max-days" value="14">
            </div>
        </div>
        <button class="btn" onclick="lendBook()">Lend Book</button>
        <button class="btn btn-secondary" onclick="viewBooks()">View Club Books</button>
        <div id="book-result" style="margin-top: 12px;"></div>
    </div>

    <!-- READING PROGRESS -->
    <div class="card hidden" id="reading-section">
        <h2>📊 Reading Progress</h2>
        <div class="flex">
            <div>
                <label>Book ID</label>
                <input type="text" id="reading-book-id" placeholder="Book ID">
            </div>
            <div>
                <label>Current Page</label>
                <input type="number" id="reading-current" placeholder="42">
            </div>
        </div>
        <div class="flex">
            <div>
                <label>Total Pages</label>
                <input type="number" id="reading-total" placeholder="320">
            </div>
            <div>
                <label>Status</label>
                <select id="reading-status">
                    <option value="CURRENTLY_READING">Currently Reading</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="WANT_TO_READ">Want to Read</option>
                    <option value="ON_HOLD">On Hold</option>
                </select>
            </div>
        </div>
        <button class="btn" onclick="updateProgress()">Update Progress</button>
        <button class="btn btn-secondary" onclick="getMyReadingList()">My Reading List</button>
        <div id="reading-result" style="margin-top: 12px;"></div>
    </div>

    <!-- TOKEN DISPLAY -->
    <div class="card" id="token-display" style="display: none;">
        <p style="font-weight: 600; margin-bottom: 8px;">🔑 Your Token (auto-saved)</p>
        <div class="token-info" id="token-text">Not logged in</div>
    </div>
</div>

<script>
    const API = 'http://localhost:8080/api/v1';
    let currentToken = '';
    let currentClubId = '';

    function headers() {
        return { 'Content-Type': 'application/json', 'Authorization': currentToken ? `Bearer ${currentToken}` : '' };
    }

    async function apiCall(method, path, body) {
        const options = { method, headers: headers() };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(API + path, options);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Request failed');
        return data;
    }

    function showResult(elementId, data) {
        document.getElementById(elementId).innerHTML = `<pre style="background:#faf8f5;padding:12px;border-radius:8px;overflow-x:auto;font-size:13px;">${JSON.stringify(data, null, 2)}</pre>`;
    }

    function showToken(token) {
        currentToken = token;
        document.getElementById('token-display').style.display = 'block';
        document.getElementById('token-text').textContent = token;
        document.querySelectorAll('.card.hidden').forEach(c => c.classList.remove('hidden'));
    }

    async function register() {
        try {
            const data = await apiCall('POST', '/auth/register', {
                fullName: document.getElementById('reg-name').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                city: document.getElementById('reg-city').value || 'Mumbai',
                state: 'Maharashtra'
            });
            showToken(data.accessToken);
            showResult('club-result', { message: 'Registered & Logged in!', user: data.fullName, email: data.email });
        } catch (e) { alert(e.message); }
    }

    async function login() {
        try {
            const data = await apiCall('POST', '/auth/login', {
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value
            });
            showToken(data.accessToken);
            showResult('club-result', { message: 'Logged in!', user: data.fullName });
        } catch (e) { alert(e.message); }
    }

    async function createClub() {
        try {
            const data = await apiCall('POST', '/clubs', {
                name: document.getElementById('club-name').value,
                city: document.getElementById('club-city').value || 'Mumbai',
                state: document.getElementById('club-state').value || 'Maharashtra',
                clubType: document.getElementById('club-type').value,
                isPrivate: false
            });
            currentClubId = data.id;
            document.getElementById('book-club-id').value = data.id;
            showResult('club-result', data);
        } catch (e) { showResult('club-result', { error: e.message }); }
    }

    async function searchClubs() {
        try {
            const city = document.getElementById('club-city').value || 'Mumbai';
            const data = await apiCall('GET', `/clubs?city=${city}&size=10`);
            if (data.content && data.content.length > 0) {
                currentClubId = data.content[0].id;
                document.getElementById('book-club-id').value = currentClubId;
            }
            showResult('club-result', data);
        } catch (e) { showResult('club-result', { error: e.message }); }
    }

    async function lendBook() {
        try {
            const policy = document.getElementById('book-policy').value;
            const body = {
                title: document.getElementById('book-title').value,
                author: document.getElementById('book-author').value,
                bookClubId: document.getElementById('book-club-id').value,
                lendingPolicy: policy,
                maxBorrowDays: parseInt(document.getElementById('book-max-days').value),
                condition: 'Good'
            };
            if (policy === 'DEPOSIT_BASED') {
                body.depositAmount = parseInt(document.getElementById('book-deposit').value);
            }
            const data = await apiCall('POST', '/books/lend', body);
            showResult('book-result', data);
        } catch (e) { showResult('book-result', { error: e.message }); }
    }

    async function viewBooks() {
        try {
            const clubId = document.getElementById('book-club-id').value;
            const data = await apiCall('GET', `/books/club/${clubId}`);
            let html = '';
            data.forEach(book => {
                html += `<div class="book-card">
                    <h3>${book.title}</h3>
                    <p>by ${book.author} | Owner: ${book.ownerName}</p>
                    <span class="status-badge status-${book.status.toLowerCase()}">${book.status}</span>
                    <span style="margin-left:8px;">Policy: ${book.lendingPolicy} | Max: ${book.maxBorrowDays} days</span>
                    ${book.depositAmount ? `<span style="margin-left:8px;">Deposit: ₹${book.depositAmount}</span>` : ''}
                    <p style="font-size:11px;color:#999;margin-top:4px;">ID: ${book.id}</p>
                </div>`;
            });
            document.getElementById('book-result').innerHTML = html || '<p>No books found</p>';
        } catch (e) { showResult('book-result', { error: e.message }); }
    }

    async function updateProgress() {
        try {
            const data = await apiCall('POST', '/reading/progress', {
                bookId: document.getElementById('reading-book-id').value,
                currentPage: parseInt(document.getElementById('reading-current').value),
                totalPages: parseInt(document.getElementById('reading-total').value),
                readingStatus: document.getElementById('reading-status').value,
                isPublic: true
            });
            showResult('reading-result', data);
        } catch (e) { showResult('reading-result', { error: e.message }); }
    }

    async function getMyReadingList() {
        try {
            const data = await apiCall('GET', '/reading/my-list');
            showResult('reading-result', data);
        } catch (e) { showResult('reading-result', { error: e.message }); }
    }
</script>
</body>
</html>
